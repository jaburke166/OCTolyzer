name: Build OCTolyzer GUI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install GUI build dependencies
        run: python -m pip install -r requirements-gui.txt

      - name: Run lightweight tests
        run: python -m unittest discover -s tests -p "test_config_loader.py"

      - name: Build standalone launcher
        run: python -m build.build_gui --clean --output-dir dist/gui

      - name: Upload launcher
        uses: actions/upload-artifact@v4
        with:
          name: OCTolyzerGUI-${{ matrix.os }}
          path: dist/gui/
          if-no-files-found: error
