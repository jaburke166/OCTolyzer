name: Build OCTolyzer GUI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compute version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install GUI build dependencies
        run: python -m pip install -r requirements-gui.txt

      - name: Install AppImage tooling
        if: runner.os == 'Linux'
        run: |
          # Nuitka's standalone/onefile mode shells out to patchelf to rewrite
          # RPATH on Linux and sysexits if it isn't on PATH; unlike ccache or
          # appimagetool, Nuitka does not fetch it automatically.
          sudo apt-get update
          sudo apt-get install -y patchelf
          curl -L --fail --show-error --silent \
            -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          echo "$PWD" >> "$GITHUB_PATH"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: Run lightweight tests
        # Kept narrow deliberately: the rest of tests/ (test_gui_support.py,
        # test_gui_widgets.py) has environment-sensitive failures unrelated to
        # this workflow (e.g. macOS /tmp<->/private/tmp symlink resolution,
        # host-specific window/splitter sizing) -- confirmed pre-existing, not
        # something this workflow's changes should paper over by excluding.
        run: python -m unittest tests.test_config_loader tests.test_gui_bootstrap

      - name: Build single-file launcher
        run: python -m build.build_gui --clean --output-dir dist/gui --product-version "${{ steps.version.outputs.version }}"

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\windows\octolyzer.iss" "/DAppVersion=${{ steps.version.outputs.version }}"

      - name: Build macOS disk image
        if: runner.os == 'macOS'
        run: bash installer/macos/build_dmg.sh dist/gui/OCTolyzerGUI.app dist/gui/OCTolyzer.dmg OCTolyzer

      - name: Upload launcher
        uses: actions/upload-artifact@v4
        with:
          name: OCTolyzerGUI-${{ matrix.os }}
          path: ${{ matrix.os == 'windows-latest' && 'dist/gui/installer/OCTolyzerSetup.exe' || matrix.os == 'macos-latest' && 'dist/gui/OCTolyzer.dmg' || 'dist/gui/OCTolyzerGUI.AppImage' }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/OCTolyzerGUI-windows-latest/OCTolyzerSetup.exe
            artifacts/OCTolyzerGUI-macos-latest/OCTolyzer.dmg
            artifacts/OCTolyzerGUI-ubuntu-latest/OCTolyzerGUI.AppImage
          generate_release_notes: true
